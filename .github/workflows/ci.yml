name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
      - name: Server answers over stdio
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
                        '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
                        '{"jsonrpc":"2.0","id":3,"method":"prompts/list"}' \
            | python mail-assistant/server/server.py > out.txt
          grep -q '"email_draft"' out.txt
          grep -q '"mail-help"' out.txt

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the plugin version
        run: |
          v=$(python -c "import json;print(json.load(open('mail-assistant/.claude-plugin/plugin.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != plugin version $v"; exit 1; }
      - name: Build Desktop extension and skill zips
        run: python desktop/build.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/mail-assistant.mcpb dist/skills/*.zip \
            --title "Mail Assistant ${GITHUB_REF_NAME}" --generate-notes
